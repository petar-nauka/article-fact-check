[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "article-fact-check"
version = "2.0.0"
description = "AI agent skill and CLI for source-backed, claim-by-claim fact-checking of articles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Petar Teodosiev" }
]
keywords = [
    "fact-checking",
    "claim-detection",
    "verification",
    "journalism",
    "ai-agent",
    "antigravity",
    "claude-code",
    "claude-skill",
    "codex",
    "audit",
    "research"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/petar-nauka/article-fact-check"
Issues = "https://github.com/petar-nauka/article-fact-check/issues"

[project.optional-dependencies]
pdf = [
    "pypdf>=3.0.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
article-fact-check = "article_fact_check.audit_tool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
